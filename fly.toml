# PRODUCTION config — app "statuslines". Staging lives in fly.staging.toml.
#
# Promote a validated staging image to prod (no rebuild):
#   fly deploy --app statuslines --image registry.fly.io/statuslines-staging:<digest>
#
# KEEP IN SYNC with fly.staging.toml by hand — Fly can't include one file from another.
# [build], [processes], [http_service] internal_port/force_https, and [deploy] must match.
# What differs on purpose: prod sizes web up (for a launch spike) and keeps it warm; staging runs
# one small [[vm]] and scales web to zero.
app = "statuslines"
primary_region = "iad"

[build]

# One process group: the public web server. It also renders submitted status lines in the
# background through E2B, on submit and at startup (ADR 0006); there is no separate worker.
[processes]
  web = "bun run .output/server/index.mjs"

[http_service]
  # Must match the app's PORT/EXPOSE in the Dockerfile (the listen port).
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]
  [http_service.concurrency]
    type = "requests"
    # Lowered from 200/250 so Fly autostarts another web machine while this one is still
    # healthy — the old limit only tripped after latency had already blown up under load.
    # Tune against live Fly metrics.
    soft_limit = 40
    hard_limit = 80

[deploy]
  release_command = "bun run src/db/migrate.ts"

# Per-process machine sizing. Repeated-wave profiling reproduced transient gallery SSR peaks with
# delayed collection, so shared-cpu-2x and 2GB give the public web process operational headroom
# while that allocation pressure is reduced. Add horizontal headroom with `fly scale count web=N`.
[[vm]]
  processes = ["web"]
  size = "shared-cpu-2x"
  memory = "2gb"
