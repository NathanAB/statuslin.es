# STAGING config — app "statuslines-staging". Production lives in fly.toml.
#
# Deploy staging:
#   fly deploy --config fly.staging.toml
#
# KEEP IN SYNC with fly.toml by hand — Fly can't include one file from another.
# [build], [processes], [http_service] internal_port/force_https, and [deploy] must match.
# What differs on purpose: staging runs one small [[vm]] and scales the web process to zero
# (min_machines_running = 0); prod sizes web up and keeps it warm. Staging also sets [env]
# NOINDEX_SITE; prod must not.
app = "statuslines-staging"
primary_region = "iad"

[build]

[env]
  # Every response carries `X-Robots-Tag: noindex, nofollow`, so search engines never index staging.
  NOINDEX_SITE = "true"

# One process group: the public web server. It also renders submitted status lines in the
# background through E2B, on submit and at startup (ADR 0006); there is no separate worker.
[processes]
  web = "bun run .output/server/index.mjs"

[http_service]
  # Must match the app's PORT/EXPOSE in the Dockerfile (the listen port).
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scale the web process to zero when idle — no machine kept warm. A cold start on the
  # first request is fine for staging. Stopping can cut a render off; the stopping machine puts
  # the job back on SIGINT and the next machine to start renders it (ADR 0006).
  min_machines_running = 0
  processes = ["web"]
  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[deploy]
  release_command = "bun run src/db/migrate.ts"

# Staging stays small — one shared-cpu-1x. Keep 512mb: 256 risks not booting given the 446MB
# peak RSS seen under load.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
