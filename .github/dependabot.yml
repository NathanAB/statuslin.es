version: 2
updates:
  # bun (not npm) so Dependabot updates bun.lock along with package.json.
  # It keeps the exact pins in package.json as-is.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      # vitest and its plugins must share a version: a lone @vitest/coverage-v8 major
      # bump against an older vitest crashes the coverage run.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      # react-dom throws at load unless react is the exact same version, so a lone
      # react bump crashes every render.
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
